# What to call the people on X and Y's maps in Korean, when nothing better is known.
#
# The same as data/en/sprites.toml, in this language: a key is the sprite a move model is
# drawn with (findings, spikes 75, 89 and 100), and a name is looked for in order — what the
# player has called them, what the game calls them out of the player's own ROM, and only
# then this file. So it is heard only when pa3ds cannot read the ROM.
#
# Every word here is the ROM's own, in this language. The English table's Nurse is a word of
# pa3ds's own that the ROM has nothing for, so it is not here.

[sprites]
# People the ROM never lists as trainers, read off lines of its own text that name them —
# the same line in every language (spikes/108_x_people.py lines).
"0x7" = "엄마"                          # Mom: "Mom's words echoed..." (system 140:43)
"0x26" = "핸섬"                         # Looker: "It's me! Looker!" (system 102:16)
"0x9a" = "팬지"                         # Alexa: "I'm Alexa. [...] Viola, is my younger sister." (story 421:10)
"0x9b" = "유리카"                        # Bonnie: "You can call me Bonnie." (story 404:0)
"0x97" = "메가진화 아저씨"                   # the Mega Evolution guru: "People call me the Mega Evolution guru!" (story 281:6)
"0x98" = "게임 디렉터"                     # the Game Director: "Hello! I am the Game Director." (story 272:0)

