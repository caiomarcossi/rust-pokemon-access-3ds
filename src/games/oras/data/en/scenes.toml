# What Omega Ruby and Alpha Sapphire show without words, in pa3ds's own words, said under
# [pa3ds.ui] descriptions.
#
# A scene follows a line of the game's text in a zone, or in none before the player has arrived
# anywhere, as in the opening: `story:402:30` is the story text's file 402,
# line 30, the same line in every language, and `text:147:67` the rest of the game's text
# (`games.common.scenes`). A scene with no line is said as the player arrives in its zone, or with
# `trigger` as they first step onto that trigger of the zone's. Its beats are said one after
# another: a beat with `demo` waits for a scene of the game's own to start (a demo, the Hall of
# Fame, the credits), one with `zone` for the player to arrive there, then `at` seconds. A name the
# game shows is never written here: `{pokemon:383}` is the game's own word, out of the player's
# ROM, as are `{trainer:N}`, `{item:N}`, `{place:N}`, and a whole line of the game's text drawn as
# a picture, `{text:123:91}`; `{memory:N}` is the Pokémon the player's own save keeps for the
# credits' Nth moment, and a beat naming one the save has not kept is left out. `{yours:N}` is the
# same Pokémon as the player's own: the nickname they gave it, or `yours` below with its name in.
# Someone the game never names is `{sprite:N}`, called what a speaker drawn as sprite N is:
# `sprites.toml` beside this file, behind the player's own name for them.
#
# Each version plays its own scenes in rooms of its own, twin zones of one layout (Seafloor
# Cavern's 0x6f in Omega Ruby, 0x6e in Alpha Sapphire), but a line said in a zone both share, as on
# Route 128, is one version's only with its `title`: 0x000400000011C400 Omega Ruby,
# 0x000400000011C500 Alpha Sapphire.
#
# Each scene was described from screenshots of a replay (spike 203, Omega Ruby's
# movie40_groudon_awakens and movie41_cave_of_origin, and Alpha Sapphire's movie2_cave_of_origin;
# spike 222, Omega Ruby's movies 48 to 53, Victory Road to the Delta Episode's opening, and Alpha
# Sapphire's movie4_hall_of_fame and movie5_delta_episode_intro); the seconds
# are from the moment its demo, line, arrival or trigger came there.

# The player's own Pokémon with no nickname, `{}` the game's name for it: "your Mega Latios".
yours = "your {}"

# The opening, before the player is anywhere, so in no zone: the professor's lines are the rest of
# the game's text, file 118, and the stretches between them where he says nothing are described
# (OR_character-desc.ctm, 2026-10-15).
