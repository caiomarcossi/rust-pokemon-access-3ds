# What to call the people on ORAS's maps in French, when nothing better is known.
#
# The same as data/en/sprites.toml, in this language: a key is the sprite a move model is
# drawn with (findings, spikes 75 and 89), and a name is looked for in order — what the
# player has called them, what the game calls them out of the player's own ROM, and only
# then this file. So it is heard only when pa3ds cannot read the ROM.
#
# Every word here is the ROM's own, in this language. The English table's Nurse, and the
# people and trainers' looks it names by what their sprite's id says, are words of pa3ds's
# own that the ROM has nothing for, so they are not here.

[sprites]
# People the ROM never lists as trainers, read off lines of its own text that name them —
# the same line in every language (spikes/91_names_in_languages.py lines).
"0x118" = "Maman"                     # Mom: the speaker's label in "Mom: Norman?" (story 268:0)
"0x13e" = "Professeur Seko"           # Professor Birch: "Did you get to meet Professor Birch?" (story 253:11)
"0xb3" = "Professeur Seko"            # Professor Birch: the same Birch, on Route 101 and in his lab
"0x11b" = "M. Marco"                  # Mr. Briney: "Mr. Briney's Cottage" (system 33:383) and story 559:13
"0x135" = "Capitaine Poupe"           # Captain Stern: "handed the Scanner to Captain Stern." (story 589:60)
"0x136" = "Professeur Kosmo"          # Professor Cozmo: "Y-you see... Professor Cozmo..." (story 36:14)
"0x161" = "Annette"                   # Lanette: "I'm Lanette." (story 40:2)
"0x11a" = "M. Rochard"                # Mr. Stone: "Mr. Stone updated your PokeNav Plus!" (story 559:2)
"0xd7" = "Beladonis"                  # Looker: the "Looker Ticket" (system 114:712)
"0xc1" = "Lévy"                       # Tate: "Liza and Tate" (system 123:107), the boy named first but in English
"0xc2" = "Tatia"                      # Liza: the same, the girl
"0x103f" = "Machopeur"                # Machoke, from the species names

