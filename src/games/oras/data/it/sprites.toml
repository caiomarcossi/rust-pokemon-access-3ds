# What to call the people and things on ORAS's maps in Italian, when nothing better is known.
#
# The same as data/en/sprites.toml, in this language: a key is the sprite a move model is
# drawn with (findings, spikes 75 and 89), and a name is looked for in order — what the
# player has called them, what the game calls them out of the player's own ROM, and only
# then this file. So it is heard only when pa3ds cannot read the ROM.
#
# Each table names what the English one does (Orion, 2026-10-14). Most words are the ROM's
# own in this language, out of the line the English word's comment names. Where the ROM has
# none, as for the Nurse and the people the English table calls by what their sprite's id
# says, the word is pa3ds's own, as the English one is.

[sprites]
# People the ROM never lists as trainers, read off lines of its own text that name them —
# the same line in every language (spikes/91_names_in_languages.py lines).
"0x118" = "Mamma"                     # Mom: the speaker's label in "Mom: Norman?" (story 268:0)
"0x13e" = "Professor Birch"           # Professor Birch: "Did you get to meet Professor Birch?" (story 253:11)
"0xb3" = "Professor Birch"            # Professor Birch: the same Birch, on Route 101 and in his lab
"0x11b" = "Signor Marino"             # Mr. Briney: "Mr. Briney's Cottage" (system 33:383) and story 559:13
"0x135" = "Capitano Remo"             # Captain Stern: "handed the Scanner to Captain Stern." (story 589:60)
"0x136" = "Professor Cosmi"           # Professor Cozmo: "Y-you see... Professor Cozmo..." (story 36:14)
"0x161" = "Lanette"                   # Lanette: "I'm Lanette." (story 40:2)
"0x11a" = "Signor Petri"              # Mr. Stone: "Mr. Stone updated your PokeNav Plus!" (story 559:2)
"0xd7" = "Bellocchio"                 # Looker: the "Looker Ticket" (system 114:712)
"0xc1" = "Tell"                       # Tate: "Liza and Tate" (system 123:107), the boy named first but in English
"0xc2" = "Pat"                        # Liza: the same, the girl
"0xd2" = "Orthilla"                   # Lisia: "That performance by Lisia and Ali just now was amazing!" (story 39:7)
"0x134" = "Mr. Fratellanza"           # Mr. Bonding: "I'm Mr. Bonding, the expert on O-Powers!" (story 570:43)
